<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Attendly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-shaped column. Header, scrolling view, bottom tab bar with four windows. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface2:#f4f7f6; --line:#dbe3e1;
  --ink:#10201e; --muted:#5b6f6b;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9efeb;
  --good:#15803d; --good-soft:#dcf3e3;
  --warn:#a15c07; --warn-soft:#fbecd0;
  --bad:#b4232a; --bad-soft:#fbe0e1;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1514; --surface:#142120; --surface2:#1a2b29; --line:#264240;
    --ink:#e6f1ef; --muted:#93aca8;
    --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#143b37;
    --good:#4ade80; --good-soft:#143523;
    --warn:#f5b84a; --warn-soft:#3b2d0f;
    --bad:#ff8a8f; --bad-soft:#401a1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1514; --surface:#142120; --surface2:#1a2b29; --line:#264240;
  --ink:#e6f1ef; --muted:#93aca8;
  --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#143b37;
  --good:#4ade80; --good-soft:#143523;
  --warn:#f5b84a; --warn-soft:#3b2d0f;
  --bad:#ff8a8f; --bad-soft:#401a1c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.top{padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font:700 18px var(--font-head)}
.top small{color:var(--muted);font-size:12px;white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto;padding-block:6px 18px;scroll-behavior:smooth}
.page-title{font-size:24px;font-weight:700;margin:6px 0 2px}
.page-sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,input[type=search]{
  width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:0 11px;color:var(--ink);font-size:14px}
input[type=file]{width:100%;font-size:13px;color:var(--muted)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:34px;padding:0 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{flex:1 1 70px;border-radius:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line)}
.chip span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{font:700 20px var(--font-head);font-variant-numeric:tabular-nums}
.chip.p b{color:var(--good)} .chip.a b{color:var(--bad)}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools .btn{flex:1}
.stu{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.stu:first-child{border-top:0}
.roll{width:62px;flex:none;font:600 12px var(--font-head);color:var(--muted);font-variant-numeric:tabular-nums}
.nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.rbtns .btn{padding:0 6px;white-space:nowrap;font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.who{flex:1;min-width:0}
.who .roll{display:block;width:auto;margin-top:1px;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{width:42px;height:36px;border:0;background:var(--surface2);font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on-p{background:var(--good);color:#fff}
.seg button.on-a{background:var(--bad);color:#fff}
.savebar{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar .btn{width:100%}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 9px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.dirty{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.empty .btn{margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item div{min-width:0;overflow-wrap:anywhere}
.item small{color:var(--muted);display:block}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner span{font-size:13px;flex:1}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:124px;height:124px;flex:none}
.ring text{fill:var(--ink);font-family:var(--font-head)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-width:0}
.tile{background:var(--surface2);border-radius:10px;padding:9px 11px}
.tile span{display:block;font-size:11px;color:var(--muted)}
.tile b{font:700 20px var(--font-head);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar::after{content:"";position:absolute;left:75%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.prow{padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.prow .h b{font-weight:600;overflow-wrap:anywhere}
.prow .h em{font-style:normal;font:600 13px var(--font-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow small{color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=page]{color:var(--accent)}
.avatar{width:72px;height:72px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 26px var(--font-head)}
.dev{display:flex;gap:14px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)} .kv b{font-weight:500;text-align:right;overflow-wrap:anywhere;min-width:0}
a{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:60}
#toast.show{opacity:1}
#pv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.pvbar .t{flex:1;min-width:0;font:600 15px var(--font-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvbar .z{min-width:44px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pvbar .btn.sm{height:36px;min-width:36px}
#pvScroll{flex:1;min-height:0;overflow:auto;padding:12px;background:var(--surface2);touch-action:pan-x pan-y pinch-zoom}
#pvScroll canvas.sheet{display:block;margin:0 auto 14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.12);max-width:none}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-left,0px));overflow:auto}
#lock[hidden]{display:none}
#lock .lk-logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#lock h1{font-size:22px;font-weight:700;margin-top:4px}
#lock p{margin:0;color:var(--muted);text-align:center;min-height:20px;font-size:13px}
#lock p.err{color:var(--bad);font-weight:600}
.dots{display:flex;gap:14px;margin:6px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:background .1s}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 24px var(--font-head);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.pad button:active{background:var(--accent-soft)}
.pad button.ghost{border-color:transparent;background:none}
.pad button svg{width:26px;height:26px}
#lkForgot,#lkCancel{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:8px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.dots.shake{animation:shake .35s}
@media (prefers-reduced-motion: reduce){.dots.shake{animation:none}}
@media (prefers-reduced-motion: reduce){main{scroll-behavior:auto}#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top gut">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <b>Attendly</b>
    </div>
    <small id="topDate"></small>
  </header>
  <main id="view" class="gut"></main>
  <nav class="tabs gut" id="tabs" aria-label="Main">
    <button data-tab="attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/></svg>Attendance</button>
    <button data-tab="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Import</button>
    <button data-tab="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Dashboard</button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14.5 3.5V8H19M9.5 13h7M9.5 16.5h7"/></svg>Report</button>
    <button data-tab="developer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8L4.5 12l4 4M15.5 8l4 4-4 4M13.5 5l-3 14"/></svg>Developer</button>
  </nav>
</div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Unlock Attendly" hidden>
  <div class="lk-logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h1 id="lkTitle">Enter PIN</h1>
  <p id="lkMsg"></p>
  <div class="dots" id="lkDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="lkPad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="ghost" id="lkBio" data-k="bio" aria-label="Use fingerprint or phone lock" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v3.5c0 2-.5 4-1.5 5.5M8.5 9.5A4 4 0 0 1 16 11v2c0 2.2-.3 4.3-1 6M5.5 8A7.5 7.5 0 0 1 19 11v1.5M5 12v-1M6.5 17c.6-1.7 1-3.5 1-5.5"/></svg></button>
    <span id="lkGap"></span>
    <button data-k="0">0</button>
    <button class="ghost" data-k="del" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9.5l5 5M18 9.5l-5 5"/></svg></button>
  </div>
  <button id="lkForgot" hidden>Forgot PIN?</button>
  <button id="lkCancel" hidden>Cancel</button>
</div>
<div id="pv" hidden role="dialog" aria-label="Report preview">
  <div class="pvbar">
    <button class="btn sm" id="pvClose" aria-label="Close preview">&times;</button>
    <span class="t" id="pvTitle">Preview</span>
    <button class="btn sm" id="pvOut" aria-label="Zoom out">&minus;</button><span class="z" id="pvZoom">100%</span><button class="btn sm" id="pvIn" aria-label="Zoom in">+</button>
    <button class="btn sm primary" id="pvSave">Download</button>
  </div>
  <div id="pvScroll"></div>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
  var msgs = [];
  function show(){
    if (window.__ok || document.getElementById('bootErr')) return;
    try {
      var d = document.createElement('pre'); d.id = 'bootErr';
      d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;margin:0;padding:20px;background:#fff;color:#b00020;font:14px monospace;white-space:pre-wrap;overflow:auto';
      d.textContent = 'Attendly could not start.\n\n' + (msgs.join('\n\n') || 'No error message was reported.') + '\n\nUser agent: ' + navigator.userAgent + '\n\nSend a screenshot of this to the developer.';
      document.documentElement.appendChild(d);
    } catch(x){}
  }
  window.addEventListener('error', function(e){ if (window.__ok) return; msgs.push((e.message || 'error') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + ')'); setTimeout(show, 50); });
  window.addEventListener('unhandledrejection', function(e){ if (window.__ok) return; msgs.push('Promise: ' + (e.reason && e.reason.message || e.reason)); });
  setTimeout(show, 4000);
})();
</script>

/* ---- Data ---- */
function seed(){
  const subs = [
    {id:'s1', name:'Data Structures', sem:3, branch:'Computer Science'},
    {id:'s2', name:'Database Systems', sem:3, branch:'Computer Science'},
    {id:'s3', name:'Operating Systems', sem:3, branch:'Computer Science'}
  ];
  const names = ['Aarav Sharma','Diya Patel','Rohan Gupta','Ananya Iyer','Vikram Singh','Meera Nair','Kabir Khan','Isha Reddy','Arjun Verma','Priya Das','Sanjay Mishra','Neha Kulkarni'];
  const cats = ['GEN','OBC','GEN','SC','GEN','OBC','GEN','EWS','GEN','SC','OBC','GEN'];
  const studs = names.map((n,i) => ({id:'t'+i, roll:'CS3' + pad(i+1), name:n, sem:3, cat:cats[i], branch:'Computer Science'}));
  const misses = [0.04,0.08,0.15,0.03,0.38,0.1,0.22,0.05,0.3,0.12,0.45,0.06];
  let r = 7;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const recs = {};
  const day = new Date();
  let made = 0;
  while (made < 9){
    day.setDate(day.getDate() - 1);
    if (day.getDay() === 0) continue;
    made++;
    subs.forEach(sb => {
      if (rnd() < 0.2) return;
      const m = {};
      studs.forEach((st,i) => { m[st.id] = rnd() < misses[i] ? 'A' : 'P'; });
      recs[ymd(day) + '|' + sb.id] = m;
    });
  }
  return {branches:['Computer Science'], subjects:subs, students:studs, records:recs, sample:true};
}
function migrate(o){
  if (!o.branches){
    const b = (o.report && o.report.branch) || 'Mechanical Engineering';
    o.branches = [b];
    (o.subjects || []).forEach(x => { if (!x.branch) x.branch = b; });
    (o.students || []).forEach(x => { if (!x.branch) x.branch = b; });
  }
  return o;
}
function load(){
  try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); if (o && o.subjects) return migrate(o); } } catch(e){}
  return seed();
}

const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtT = t => { if (!t) return 'No time'; const [hh, mm] = t.split(':').map(Number); return ((hh % 12) || 12) + ':' + pad(mm) + ' ' + (hh < 12 ? 'AM' : 'PM'); };
const recKey = (date, subId, t) => date + '|' + subId + (t ? '|' + t : '');
const parseKey = k => { const p = k.split('|'); return {date: p[0], subId: p[1], time: p[2] || ''}; };
const classTimes = (date, subId) => Object.keys(S.records).map(parseKey).filter(c => c.date === date && c.subId === subId).map(c => c.time).sort();
function currentSubject(){ return S.subjects.find(x => x.id === ui.subjectId); }
function studentsFor(sub){ return sub ? S.students.filter(s => s.sem === sub.sem && s.branch === sub.branch).sort((a,b) => a.roll.localeCompare(b.roll, undefined, {numeric:true})) : []; }
function loadDraft(){
  const sub = currentSubject();
  if (!sub){ ui.draft = null; return; }
  if (ui.cls !== null && !S.records[recKey(ui.date, sub.id, ui.cls)]) ui.cls = null;
  const saved = ui.cls === null ? null : S.records[recKey(ui.date, sub.id, ui.cls)];
  const m = {};
  studentsFor(sub).forEach(s => { m[s.id] = saved && saved[s.id] ? saved[s.id] : 'P'; });
  ui.draft = {marks: m, saved: !!saved};
  ui.dirty = false;

}

function saveAttendance(){
  const sub = currentSubject(); if (!sub || !ui.draft) return;
  const t = ui.time;
  if (ui.cls === null && !t) return toast('Enter the class time');
  const key = recKey(ui.date, sub.id, t), oldKey = ui.cls === null ? null : recKey(ui.date, sub.id, ui.cls);
  if (key !== oldKey && S.records[key]) return toast('A class is already saved at this time. Pick it from Class, or change the time.');
  if (oldKey && oldKey !== key) delete S.records[oldKey];
  S.records[key] = {...ui.draft.marks};
  ui.cls = t;
  persist(); ui.draft.saved = true; ui.dirty = false; paintClasses(); paintAttendance();
  const a = Object.values(ui.draft.marks).filter(x => x === 'A').length;
  toast(`Saved. ${Object.keys(ui.draft.marks).length - a} present, ${a} absent`);
}

let xlsxPromise;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise((res, rej) => {
    const tryLoad = (src, next) => {
      const s = document.createElement('script'); s.src = src; s.onload = res;
      s.onerror = () => next ? tryLoad(next) : rej(new Error('Excel reader could not load'));
      document.head.appendChild(s);
    };
    tryLoad('vendor/xlsx.full.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  });
  xlsxPromise.catch(() => { xlsxPromise = null; });
  return xlsxPromise;
}
function parseSheet(rows){
  rows = rows.filter(r => r && r.some(c => String(c).trim() !== ''));
  if (!rows.length) return [];
  let rc = 0, nc = 1, cc = -1, start = 0, single = rows[0].length < 2;
  const hi = rows.slice(0, 5).findIndex(r => r.some(c => /name/i.test(c)));
  if (hi >= 0){
    const h = rows[hi];
    nc = h.findIndex(c => /name/i.test(c));
    let r2 = h.findIndex((c, i) => i !== nc && /roll|reg|enrol/i.test(c));
    if (r2 < 0) r2 = h.findIndex((c, i) => i !== nc && /\bid\b|admission/i.test(c));
    rc = r2 >= 0 ? r2 : (nc === 0 ? 1 : 0);
    cc = h.findIndex((c, i) => i !== nc && i !== rc && /categ|^\s*cat\.?\s*$/i.test(c));
    start = hi + 1; single = false;
  } else if (single){ nc = 0; }
  const out = [];
  rows.slice(start).forEach((r, i) => {
    const name = String(r[nc] ?? '').trim();
    if (!name) return;
    const roll = single ? String(i + 1) : String(r[rc] ?? '').trim() || String(i + 1);
    out.push({roll, name, cat: cc >= 0 ? String(r[cc] ?? '').trim() : ''});
  });
  return out;
}

async function onFile(e){
  const f = e.target.files[0]; const box = $('#impPreview');
  if (!f) return;
  box.innerHTML = '<p class="hint">Reading file...</p>';
  try {
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    const list = parseSheet(rows);
    if (!list.length){ box.innerHTML = '<p class="hint" style="color:var(--bad)">No students found. Check that the sheet has a Name column.</p>'; return; }
    ui.importRows = list;
    box.innerHTML = `<div style="margin-top:10px"><span class="badge ok">${list.length} students found</span>
      <p class="hint">First rows: ${list.slice(0,3).map(s => esc(s.roll + ' ' + s.name)).join(', ')}${list.length > 3 ? '...' : ''}</p>
      <button class="btn primary" id="impGo" style="width:100%;margin-top:6px">Import ${list.length} students</button></div>`;
    $('#impGo').onclick = doImport;
  } catch(err){
    box.innerHTML = '<p class="hint" style="color:var(--bad)">Could not read this file. Try .xlsx or .csv, and check your connection if the Excel reader was not bundled.</p>';
  }
}
function doImport(){
  const sem = +$('#impSem').value, branch = $('#impBranch').value; let added = 0, updated = 0;
  if (!branch) return toast('Add a branch first');
  ui.importRows.forEach(r => {
    const ex = S.students.find(s => s.sem === sem && s.branch === branch && s.roll.toLowerCase() === r.roll.toLowerCase());

/* ---- Window 3: Dashboard ---- */
function computeStats(branch, sem, subId){
  const students = S.students.filter(s => s.sem === sem && s.branch === branch);
  const subs = S.subjects.filter(x => x.branch === branch && x.sem === sem && (!subId || x.id === subId));
  const ids = new Set(subs.map(x => x.id));
  const keys = Object.keys(S.records).filter(k => ids.has(k.split('|')[1]));
  let P = 0, T = 0;
  const rows = students.map(s => {
    let p = 0, t = 0;
    keys.forEach(k => { const m = S.records[k][s.id]; if (m){ t++; if (m === 'P') p++; } });
    P += p; T += t;
    return {s, p, t, pct: t ? p / t * 100 : null};
  });
  return {rows, held: keys.length, overall: T ? P / T * 100 : null, subs};
}

/* ---- Window 4: Report (attendance sheet as PDF, with preview) ---- */
/* The same drawing list feeds both the on-screen preview and the PDF file, so they always match. */
const PW = 841.89, PH = 595.28, PM = 28;           /* A4 landscape, points */
const FSANS = 'Arial,Helvetica,"Liberation Sans",sans-serif', FSERIF = '"Times New Roman",Times,"Liberation Serif",serif';
const FONTS = {

  F2:{pdf:'Times-Bold', css:FSERIF, bold:true, w:[250,333,555,500,500,1000,833,278,333,333,500,570,250,333,250,278,500,500,500,500,500,500,500,500,500,500,333,333,570,570,570,500,930,722,667,722,722,667,611,778,778,389,500,778,667,944,722,778,611,778,722,556,667,722,722,1000,722,722,667,333,278,333,581,500,333,500,556,444,556,444,333,500,556,278,333,556,278,833,556,500,556,556,444,389,333,556,500,722,500,500,444,394,220,394,520]},
  F3:{pdf:'Helvetica', css:FSANS, bold:false, w:[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584]},
  F4:{pdf:'Helvetica-Bold', css:FSANS, bold:true, w:[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584]}
};
const clean = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/[^\x20-\x7e\xa0-\xff]/g, '?');
const tw = (f, s, sz) => { let t = 0; for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); t += c >= 32 && c <= 126 ? FONTS[f].w[c - 32] : 556; } return t * sz / 1000; };
const ordinal = n => n + ({1:'st', 2:'nd', 3:'rd'}[n] || 'th');
const SESS_DEFAULT = {teacher: DEV.name, branch: 'Mechanical Engineering', session: 'Aug-Jan, 2026'};
const NCOLS = 15;

function reportData(sem, subId){
  const sb = S.subjects.find(x => x.id === subId);
  const students = S.students.filter(s => s.sem === sem && (!sb || s.branch === sb.branch)).sort((a,b) => a.roll.localeCompare(b.roll, undefined, {numeric:true}));
  const classes = Object.keys(S.records).filter(k => parseKey(k).subId === subId).map(k => ({k, ...parseKey(k)})).sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  return {students, classes};
}

function buildReport(o){
  const rd = reportData(o.sem, o.subId), students = rd.students, dates = o.filled ? rd.classes : [];
  const xSl = PM, xName = xSl + 34, xRoll = xName + 146, xCat = xRoll + 100, xD0 = xCat + 44, xEnd = PW - PM;
  const dw = (xEnd - xD0) / NCOLS;
  const top = 100, hh = 18, bodyTop = top + hh * 2, rowH = 21;
  const per = Math.floor((PH - PM - bodyTop) / rowH);
  const dChunks = Math.max(1, Math.ceil(dates.length / NCOLS));
  const sChunks = Math.max(1, Math.ceil(students.length / per));
  const total = dChunks * sChunks, pages = [];
  for (let dc = 0; dc < dChunks; dc++) for (let sc = 0; sc < sChunks; sc++){
    const ops = [], rows = students.slice(sc * per, (sc + 1) * per);
    const L = (x1, y1, x2, y2, w) => ops.push({k:'l', x1, y1, x2, y2, w});
    const T = (f, sz, x, y, s, al) => { s = clean(s); const w = tw(f, s, sz); if (al === 'c') x -= w / 2; else if (al === 'r') x -= w; ops.push({k:'t', f, sz, x, y, s, w}); return w; };
    const fitT = (f, sz, min, x, y, s, maxW) => { s = clean(s); while (sz > min && tw(f, s, sz) > maxW) sz -= .5; return T(f, sz, x, y, s); };

    /* Title with superscript ordinal, underlined */
    const a = 'ATTENDANCE SHEET(' + o.sem, b = ordinal(o.sem).replace(/^\d+/, ''), c = ' SEMESTER)';
    const wa = tw('F2', a, 15), wb = tw('F2', b, 9.5), wc = tw('F2', c, 15);
    let tx = PW / 2 - (wa + wb + wc) / 2;
    T('F2', 15, tx, 44, a); T('F2', 9.5, tx + wa, 38.5, b); T('F2', 15, tx + wa + wb, 44, c);
    L(tx, 46.5, tx + wa + wb + wc, 46.5, .8);

    /* Header lines */
    const lx = PM + 50, rx = PM + .613 * (PW - 2 * PM);
    T('F2', 11, lx, 70, 'NAME OF TEACHER:'); fitT('F1', 11, 7, lx + 126, 70, o.teacher, rx - lx - 134);
    T('F2', 11, lx, 86, 'BRANCH:'); fitT('F1', 11, 7, lx + 126, 86, o.branch.toUpperCase(), rx - lx - 134);
    const w1 = T('F2', 11, rx, 70, 'SESSION:'); fitT('F1', 11, 7, rx + w1 + 4, 70, o.session, xEnd - rx - w1 - 6);
    const w2 = T('F2', 11, rx, 86, 'NAME OF SUBJECT:'); fitT('F1', 11, 7, rx + w2 + 4, 86, o.subject, xEnd - rx - w2 - 6);

    /* Grid */
    const bottom = bodyTop + rows.length * rowH;
    const vx = [xName, xRoll, xCat, xD0]; for (let i = 1; i < NCOLS; i++) vx.push(xD0 + i * dw);
    L(xSl, top, xEnd, top, 1); L(xSl, bottom, xEnd, bottom, 1); L(xSl, top, xSl, bottom, 1); L(xEnd, top, xEnd, bottom, 1);
    vx.forEach(x => L(x, top, x, bottom, .5));
    L(xCat, top + hh, xEnd, top + hh, .5); L(xSl, bodyTop, xEnd, bodyTop, 1);
    for (let r = 1; r < rows.length; r++) L(xSl, bodyTop + r * rowH, xEnd, bodyTop + r * rowH, .5);

    /* Header text */
    T('F2', 9, xSl + 17, top + 16, 'SL.', 'c'); T('F2', 9, xSl + 17, top + 28, 'NO', 'c');
    T('F2', 11, (xName + xRoll) / 2, top + 22.5, 'NAME', 'c'); T('F2', 11, (xRoll + xCat) / 2, top + 22.5, 'Roll No', 'c');
    T('F2', 7.5, xCat + 3, top + 12.5, 'DATE:'); T('F2', 7.5, xCat + 3, top + hh + 12.5, 'TIME:');
    for (let i = 0; i < NCOLS; i++){
      const d = dates[dc * NCOLS + i]; if (!d) continue;
      const p = d.date.split('-'); T('F3', 6.5, xD0 + (i + .5) * dw, top + 12, p[2] + '/' + p[1], 'c');
      if (d.time) T('F3', 5.5, xD0 + (i + .5) * dw, top + hh + 11.5, fmtT(d.time).replace(' ', ''), 'c');
    }

    /* Student rows */
    rows.forEach((s, r) => {
      const y = bodyTop + r * rowH, mid = y + rowH / 2;
      T('F3', 9, xSl + 17, mid + 3.2, String(sc * per + r + 1), 'c');
      const name = s.name.toUpperCase(), maxW = xRoll - xName - 8;
      if (tw('F3', clean(name), 9) <= maxW) T('F3', 9, xName + 4, mid + 3.2, name);
      else {
        const words = name.split(/\s+/); let l1 = '', i = 0;
        while (i < words.length - 1 && tw('F3', clean((l1 + ' ' + words[i]).trim()), 8) <= maxW) l1 = (l1 + ' ' + words[i++]).trim();
        if (!l1){ l1 = words[0]; i = 1; }
        let l2 = words.slice(i).join(' '), sz = 8;
        while (sz > 5.5 && (tw('F3', clean(l1), sz) > maxW || tw('F3', clean(l2), sz) > maxW)) sz -= .5;
        T('F3', sz, xName + 4, mid - 1.2, l1); T('F3', sz, xName + 4, mid + sz + .2, l2);
      }
      fitT('F3', 9, 6, xRoll + 4, mid + 3.2, s.roll.toUpperCase(), xCat - xRoll - 8);
      if (s.cat) T('F3', 8, xCat + 3, mid + 3, s.cat.toUpperCase());
      for (let i = 0; i < NCOLS; i++){
        const d = dates[dc * NCOLS + i]; if (!d) continue;
        const m = (S.records[d.k] || {})[s.id];
        if (m) T(m === 'A' ? 'F4' : 'F3', 9, xD0 + (i + .5) * dw, mid + 3.2, m, 'c');
      }
    });
    if (!rows.length) T('F3', 10, PW / 2, bodyTop + 20, 'No students in this semester', 'c');
    if (total > 1) T('F3', 7, PW / 2, PH - 12, `Page ${dc * sChunks + sc + 1} of ${total}`, 'c');
    pages.push(ops);
  }
  return {pages, students: students.length, dates: dates.length};
}

/* Draw one page of the drawing list on a canvas (used by the preview). */
function paintPage(cv, ops, cssW){
  const k = Math.min(4, Math.max(1, cssW * (window.devicePixelRatio || 1) / PW));
  cv.width = Math.round(PW * k); cv.height = Math.round(PH * k);
  cv.style.width = cssW + 'px'; cv.style.height = (cssW * PH / PW) + 'px';
  const g = cv.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0);
  g.fillStyle = '#fff'; g.fillRect(0, 0, PW, PH); g.fillStyle = g.strokeStyle = '#000'; g.textBaseline = 'alphabetic'; g.lineCap = 'square';
  ops.forEach(o => {
    if (o.k === 'l'){ g.lineWidth = o.w; g.beginPath(); g.moveTo(o.x1, o.y1); g.lineTo(o.x2, o.y2); g.stroke(); }
    else { const f = FONTS[o.f]; g.font = `${f.bold ? 'bold ' : ''}${o.sz}px ${f.css}`; g.fillText(o.s, o.x, o.y, o.w); }
  });
}

/* Write the PDF file: real vector text and lines, standard fonts, no libraries. */
function makePDF(pages){
  const num = n => (Math.round(n * 100) / 100).toString();
  const esc = s => { let r = ''; for (const ch of s){ const c = ch.charCodeAt(0); r += ch === '\\' || ch === '(' || ch === ')' ? '\\' + ch : c < 127 ? ch : '\\' + c.toString(8).padStart(3, '0'); } return r; };
  const obj = [null];
  const n = pages.length;
  obj[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  obj[2] = `<< /Type /Pages /Kids [${pages.map((_, i) => (7 + 2 * i) + ' 0 R').join(' ')}] /Count ${n} >>`;
  ['F1','F2','F3','F4'].forEach((k, i) => obj[3 + i] = `<< /Type /Font /Subtype /Type1 /BaseFont /${FONTS[k].pdf} /Encoding /WinAnsiEncoding >>`);
  pages.forEach((ops, i) => {
    let s = '0 G 0 g 1 J\n';
    ops.forEach(o => {
      if (o.k === 'l') s += `${num(o.w)} w ${num(o.x1)} ${num(PH - o.y1)} m ${num(o.x2)} ${num(PH - o.y2)} l S\n`;
      else s += `BT /${o.f} ${num(o.sz)} Tf ${num(o.x)} ${num(PH - o.y)} Td (${esc(o.s)}) Tj ET\n`;
    });
    obj[7 + 2 * i] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${8 + 2 * i} 0 R >>`;
    obj[8 + 2 * i] = `<< /Length ${s.length} >>\nstream\n${s}endstream`;
  });
  let out = '%PDF-1.4\n', offs = [];
  for (let i = 1; i < obj.length; i++){ offs[i] = out.length; out += `${i} 0 obj\n${obj[i]}\nendobj\n`; }
  const xr = out.length;
  out += `xref\n0 ${obj.length}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${obj.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 255;
  return u;
}

function reportOpts(){
  const sub = S.subjects.find(x => x.id === ui.repSub), R = S.report;
  return {sem: sub.sem, subId: sub.id, subject: sub.name, teacher: R.teacher, branch: R.branch, session: R.session, filled: ui.repFill !== 'blank'};

function reportFileName(o){ return ('Attendance_Sem' + o.sem + '_' + o.subject).replace(/[^A-Za-z0-9]+/g, '_').replace(/_+$/, '') + '.pdf'; }

/* Preview overlay: every page, with zoom */
const pv = {pages: null, zoom: 1, name: ''};
function openPreview(){

function paintPreview(){

function closePreview(){ $('#pv').hidden = true; document.body.style.overflow = ''; $('#pvScroll').innerHTML = ''; }
function setZoom(z){ pv.zoom = Math.max(.5, Math.min(4, z)); paintPreview(); }

const toB64 = bytes => { let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(bin); };
async function printPDF(){
  try {
    const o = reportOpts(), pages = buildReport(o).pages, name = reportFileName(o), bytes = makePDF(pages), PP = plug('AppTools');
    if (isNative()){
      if (PP) await PP.print({name: name.replace(/\.pdf$/, ''), data: toB64(bytes)});
      else { toast('Choose Print from the share menu'); await savePDF(pages, name); }
      return;
    }
    const url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
    const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
    f.onload = () => setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){ window.open(url, '_blank'); } }, 300);
    f.src = url; document.body.appendChild(f);
    setTimeout(() => { f.remove(); URL.revokeObjectURL(url); }, 120000);
  } catch(err){ toast('Could not print'); }
}
async function savePDF(pages, name){
  try {
    if (!pages){ const o = reportOpts(); pages = buildReport(o).pages; name = reportFileName(o); }
    const bytes = makePDF(pages), FS = plug('Filesystem'), SH = plug('Share');
    if (FS && SH){
      const r = await FS.writeFile({path: name, data: toB64(bytes), directory: 'CACHE'});
      await SH.share({title: name, url: r.uri, dialogTitle: 'Save or share the attendance sheet'});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('PDF saved: ' + name);
    }
  } catch(err){ if (!/cancel|dismiss/i.test(String(err && err.message || err))) toast('Could not save the PDF'); }
}

/* ---- Google Drive backup: one private file in this app's hidden app-data folder of the user's own Drive ---- */
const G = {
  auth: 'https://accounts.google.com/o/oauth2/v2/auth',
  token: 'https://oauth2.googleapis.com/token',
  revoke: 'https://oauth2.googleapis.com/revoke',
  redirect: 'com.attendly.app:/oauth2redirect',
  scope: 'https://www.googleapis.com/auth/drive.appdata openid email',
  file: 'attendly-backup.json'
};
const DKEY = 'attendly.drive', CKEY = 'attendly.gcid', OKEY = 'attendly.oauth';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const driveInfo = () => lsGet(DKEY);
const clientId = () => String(DEV.googleClientId || lsGet(CKEY) || '').trim();
const form = o => Object.keys(o).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(o[k])).join('&');
const b64u = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64u(a); };
const fmtWhen = iso => { try { return new Date(iso).toLocaleString([], {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}); } catch(e){ return ''; } };
const jwtEmail = t => { try { const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(p)))).email || ''; } catch(e){ return ''; } };

/* HTTP goes through the phone (no browser CORS limits); a normal fetch is the fallback */
async function gfetch(url, o = {}){
  let method = o.method || 'GET'; const headers = Object.assign({}, o.headers);
  if (method === 'PATCH'){ method = 'POST'; headers['X-HTTP-Method-Override'] = 'PATCH'; }
  const T = plug('AppTools');
  if (T){ const r = await T.http({url, method, headers, body: o.body || ''}); return {status: r.status, text: r.text}; }
  const r = await fetch(url, {method, headers, body: o.body}); return {status: r.status, text: await r.text()};
}
const jparse = t => { try { return JSON.parse(t); } catch(e){ return {}; } };
function driveMsg(text, err){ drv.msg = text || ''; drv.err = !!err; paintDrive(); }

async function driveConnect(){
  const id = clientId();
  if (!id) return toast('Enter the Google client ID first');
  if (!isNative()) return toast('Connect works in the installed Android app');
  const T = plug('AppTools'); if (!T) return toast('Google sign-in is not available in this build');
  try {
    const verifier = rnd(48), state = rnd(16);
    const challenge = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    lsSet(CKEY, id); lsSet(OKEY, {verifier, state, id});
    await T.openUrl({url: G.auth + '?' + form({client_id: id, redirect_uri: G.redirect, response_type: 'code', scope: G.scope, code_challenge: challenge, code_challenge_method: 'S256', state, access_type: 'offline', prompt: 'consent select_account'})});
  } catch(e){ driveMsg('Could not open Google sign-in', true); }
}
async function onOAuthUrl(url){
  const pend = lsGet(OKEY); if (!url || !pend) return; lsSet(OKEY, null);
  const qs = new URLSearchParams(String(url).split('?')[1] || '');
  if (qs.get('error')) return driveMsg('Sign-in was cancelled', true);
  if (qs.get('state') !== pend.state || !qs.get('code')) return driveMsg('Sign-in failed. Please try again.', true);
  driveMsg('Connecting...');
  try {
    const r = await gfetch(G.token, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: form({code: qs.get('code'), client_id: pend.id, code_verifier: pend.verifier, redirect_uri: G.redirect, grant_type: 'authorization_code'})});
    const j = jparse(r.text);
    if (r.status !== 200 || !j.refresh_token) return driveMsg('Google did not accept the sign-in' + (j.error_description ? ': ' + j.error_description : '') + '.', true);
    drv.at = j.access_token; drv.exp = Date.now() + (j.expires_in || 3600) * 1000;
    lsSet(DKEY, {refresh: j.refresh_token, email: jwtEmail(j.id_token), auto: false, last: ''});
    const f = await driveFind(drv.at);
    if (f){ await driveLoad(drv.at, f); driveMsg(drv.found ? 'Connected. A backup was found in your Drive.' : 'Connected, but the backup in your Drive could not be read.', !drv.found); }
    else { const d = driveInfo(); d.auto = true; lsSet(DKEY, d); driveMsg('Connected.'); driveAuto(); }
  } catch(e){ driveMsg('Could not connect: ' + (e.message || e), true); }
}
async function driveToken(){
  const d = driveInfo(); if (!d || !d.refresh) throw new Error('Not connected');
  if (drv.at && Date.now() < drv.exp - 60000) return drv.at;
  const r = await gfetch(G.token, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: form({client_id: clientId(), refresh_token: d.refresh, grant_type: 'refresh_token'})});
  const j = jparse(r.text);
  if (r.status !== 200 || !j.access_token){
    if (j.error === 'invalid_grant'){ lsSet(DKEY, null); drv.at = ''; throw new Error('Google sign-in expired. Please connect again.'); }
    throw new Error('Could not sign in to Google (' + r.status + ')');
  }
  drv.at = j.access_token; drv.exp = Date.now() + (j.expires_in || 3600) * 1000; return drv.at;
}
const gauth = tok => ({Authorization: 'Bearer ' + tok});
async function driveFind(tok){
  const r = await gfetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1&orderBy=' + encodeURIComponent('modifiedTime desc') + '&fields=' + encodeURIComponent('files(id,modifiedTime)') + '&q=' + encodeURIComponent("name='" + G.file + "'"), {headers: gauth(tok)});
  if (r.status !== 200) throw new Error('Google Drive said ' + r.status);
  const f = (jparse(r.text).files || [])[0]; return f || null;
}
async function driveLoad(tok, f){
  drv.found = null;
  const r = await gfetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', {headers: gauth(tok)});
  const o = jparse(r.text);
  if (r.status === 200 && o && o.data && Array.isArray(o.data.subjects) && Array.isArray(o.data.students) && o.data.records)
    drv.found = {when: o.savedAt || f.modifiedTime, students: o.data.students.length, classes: Object.keys(o.data.records).length, data: o.data};
}
async function driveBackup(silent){
  if (drv.busy) return; drv.busy = true;
  try {
    if (!silent) driveMsg('Backing up...');
    const tok = await driveToken(), body = JSON.stringify({app: 'attendly', v: 1, savedAt: new Date().toISOString(), data: S}), f = await driveFind(tok);
    let r;
    if (f) r = await gfetch('https://www.googleapis.com/upload/drive/v3/files/' + f.id + '?uploadType=media', {method: 'PATCH', headers: Object.assign({'Content-Type': 'application/json'}, gauth(tok)), body});
    else {
      const b = 'attendly' + Date.now(), meta = JSON.stringify({name: G.file, parents: ['appDataFolder']});
      r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {method: 'POST', headers: Object.assign({'Content-Type': 'multipart/related; boundary=' + b}, gauth(tok)), body: `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`});
    }
    if (r.status < 200 || r.status >= 300) throw new Error('Google Drive said ' + r.status);
    const d = driveInfo(); if (d){ d.last = new Date().toISOString(); lsSet(DKEY, d); }
    drv.msg = silent ? '' : 'Backup saved to your Google Drive.'; drv.err = false; if (!silent) toast('Backup saved');
  } catch(e){ drv.msg = 'Backup failed: ' + (e.message || e); drv.err = true; }
  finally { drv.busy = false; paintDrive(); }
}
function driveAuto(){
  const d = driveInfo();
  if (!d || !d.auto || S.sample || drv.found || !(S.students.length || Object.keys(S.records).length)) return;
  clearTimeout(drv.t); drv.t = setTimeout(() => driveBackup(true), 6000);
}
async function driveCheck(){
  if (drv.busy) return; drv.busy = true; driveMsg('Looking for a backup...');
  try {
    const tok = await driveToken(), f = await driveFind(tok);
    if (!f){ drv.found = null; drv.busy = false; return driveMsg('No backup found in your Google Drive yet.'); }
    await driveLoad(tok, f);
    drv.msg = drv.found ? '' : 'The backup in your Drive could not be read.'; drv.err = !drv.found;
  } catch(e){ drv.msg = 'Could not check Drive: ' + (e.message || e); drv.err = true; }
  finally { drv.busy = false; paintDrive(); }
}
function driveRestore(){
  if (!drv.found) return;
  clearTimeout(drv.t);
  S = migrate(JSON.parse(JSON.stringify(drv.found.data))); persistRaw();
  Object.assign(ui, {subjectId: '', branch: '', cls: null, time: '', draft: null, dirty: false, stuBranch: '', dashBranch: '', dashSem: '', dashSub: '', repSynced: '', repSub: '', repSem: '', importRows: null});
  drv.found = null; const d = driveInfo(); if (d){ d.auto = true; lsSet(DKEY, d); }
  driveMsg('Restored from your Google Drive backup.'); toast('Data restored');
}
const persistRaw = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
async function driveOff(){
  const d = driveInfo(); clearTimeout(drv.t);
  if (d && d.refresh){ try { await gfetch(G.revoke, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: form({token: d.refresh})}); } catch(e){} }
  lsSet(DKEY, null); drv.at = ''; drv.found = null; driveMsg('Disconnected. Your backup stays in your Google Drive.');
}

      <label style="display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="drvAuto"${d.auto ? ' checked' : ''} style="width:20px;height:20px"> Back up automatically after changes</label>

  }
  if (drv.found) x += `<div style="margin-top:12px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)">
      <b>Backup found</b><div style="font-size:13px;color:var(--muted);margin:4px 0 10px">Saved ${esc(fmtWhen(drv.found.when))}: ${drv.found.students} students, ${drv.found.classes} classes. Restoring replaces the data on this phone.</div>
      <div class="row"><button class="btn primary" id="d
