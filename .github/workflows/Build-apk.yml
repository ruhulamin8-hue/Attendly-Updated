          @CapacitorPlugin(name = "AppTools")
          public class AppToolsPlugin extends Plugin {
            static AppToolsPlugin inst;
            static String pending;

            @Override
            public void load() { inst = this; }

            /* Google sign-in comes back to the app as com.attendly.app:/oauth2redirect?code=... */
            static void deliver(Intent it) {
              if (it == null || it.getData() == null) return;
              String u = it.getData().toString();
              if (!u.startsWith("com.attendly.app:")) return;
              pending = u;
              if (inst != null) {
                JSObject o = new JSObject();
                o.put("url", u);
                inst.notifyListeners("oauthRedirect", o, true);
              }
            }

            @PluginMethod
            public void takePending(PluginCall call) {
              JSObject r = new JSObject();
              r.put("url", pending == null ? "" : pending);
              pending = null;
              call.resolve(r);
            }

            @PluginMethod
            public void openUrl(PluginCall call) {
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(call.getString("url")));
                getActivity().startActivity(i);
                call.resolve();
              } catch (Exception e) {
                call.reject(e.toString());
              }
            }

