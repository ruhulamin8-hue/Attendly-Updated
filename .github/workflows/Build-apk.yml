name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Bundle the Excel reader
        run: npm run vendor

      - name: Create the Android project
        run: npx cap add android

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Add print and share support
        run: |
          D=android/app/src/main/java/com/attendly/app
          mkdir -p $D
          cp $D/MainActivity.java $D/MainActivity.java.orig
          cat > $D/AppToolsPlugin.java <<'EOF'
